<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小月亮 · 母婴记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2026-10-15.5">
<script>try { var th = localStorage.getItem("xiaoyueliang.v1.theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="bname" id="bname" aria-haspopup="menu" aria-expanded="false" aria-controls="kids">小月亮<span class="chev" aria-hidden="true"></span></button>
      <span id="bage">先在设置里填宝宝生日</span>
      <div class="kids" id="kids" role="menu" aria-label="切换孩子" hidden></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="status" id="status"><span class="dot"></span>本机保存</span>
      <button class="iconbtn" data-act="settings" aria-label="设置">设置</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="主导航"><div class="in">
  <button data-tab="today"><i aria-hidden="true">☀︎</i>今天</button>
  <button data-tab="log"><i aria-hidden="true">≡</i>记录</button>
  <button data-tab="mom"><i aria-hidden="true">♡</i>妈妈</button>
  <button data-tab="grow"><i aria-hidden="true">↗</i>成长</button>
  <button data-tab="learn"><i aria-hidden="true">?</i>问答</button>
</div></nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="js/app.js?v=2026-10-15.5"></script>
</body>
</html>
