<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小月亮 · 母婴记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1D2733; --muted:#5A6676; --line:#DCE1E8;
  --slate:#45658F; --slate-soft:#E3EAF4; --honey:#E9B83A; --honey-soft:#FFF5D1;
  --sage:#4F8D6A; --sage-soft:#E2F0E7; --rose:#B44B60; --rose-soft:#FBE6EA; --sky:#5F95CC;
  --radius-lg:22px; --radius:12px; --radius-sm:8px;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Outfit","Noto Sans SC",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#131921; --surface:#1B232E; --ink:#E7ECF2; --muted:#9BA7B6; --line:#2C3644;
  --slate:#93B3DC; --slate-soft:#243245; --honey:#F0C75A; --honey-soft:#3A321E;
  --sage:#7EBC98; --sage-soft:#1E3328; --rose:#E58A9C; --rose-soft:#3A2228; --sky:#8DB8E4;
}}
:root[data-theme="dark"]{
  --bg:#131921; --surface:#1B232E; --ink:#E7ECF2; --muted:#9BA7B6; --line:#2C3644;
  --slate:#93B3DC; --slate-soft:#243245; --honey:#F0C75A; --honey-soft:#3A321E;
  --sage:#7EBC98; --sage-soft:#1E3328; --rose:#E58A9C; --rose-soft:#3A2228; --sky:#8DB8E4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:20px;letter-spacing:.02em}
.brand span{font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:44px;height:44px;padding:0 14px;cursor:pointer;font-size:14px}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--sage)}
h2{font-size:18px;margin:28px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Hero: the one bold element — the "since last feed" clock */
.hero{background:var(--honey);color:#1D2733;border-radius:var(--radius-lg);padding:22px 22px 18px;margin-top:8px;position:relative;overflow:hidden}
.hero .lbl{font-size:15px;font-weight:500}
.hero .big{font-family:var(--f-num);font-weight:700;font-size:clamp(52px,15vw,84px);line-height:1;letter-spacing:-.02em;margin:6px 0 10px}
.hero .big small{font-size:.38em;font-weight:600;margin-left:2px;margin-right:8px}
.hero .meta{font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.hero .side{display:inline-block;background:#1D2733;color:#FFF5D1;border-radius:999px;padding:2px 12px;font-weight:700}
.hero.sleeping{background:#2D3F5E;color:#E7ECF2}
.hero.sleeping .side{background:#E7ECF2;color:#2D3F5E}
.hero .moon{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;box-shadow:-22px 16px 0 0 rgba(29,39,51,.10);pointer-events:none}
.hero.sleeping .moon{box-shadow:-22px 16px 0 0 rgba(255,245,209,.25)}
.hero .act{margin-top:14px}
.hero .act button{background:#1D2733;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.hero.sleeping .act button{background:#FFF5D1;color:#1D2733}

/* Quick add */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 4px;min-height:72px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.quick button i{font-style:normal;font-size:22px;line-height:1}
@media (max-width:380px){.quick{grid-template-columns:repeat(3,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.panel + .panel{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.stat:last-child:nth-child(odd){grid-column:auto}}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:26px;line-height:1.1}
.stat .v small{font-size:14px;font-weight:400;color:var(--muted);margin-left:2px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .ref{font-size:12px;color:var(--muted);margin-top:2px}
.stat .ref.warn{color:var(--rose);font-weight:500}

.alert{border-radius:var(--radius);padding:12px 14px;margin-top:10px;font-size:14px;border:1px solid}
.alert.red{background:var(--rose-soft);border-color:var(--rose);}
.alert.red b{color:var(--rose)}
.alert.info{background:var(--slate-soft);border-color:transparent}

/* entries */
.day{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:500}
.entry{display:grid;grid-template-columns:52px 10px 1fr;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.entry:hover{background:var(--slate-soft)}
.entry .t{font-family:var(--f-num);font-size:15px;padding-top:1px}
.entry .c{width:10px;height:10px;border-radius:3px;margin-top:7px}
.entry .s{font-size:15px}
.entry .n{font-size:13px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
/* view switcher */
.vtabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--slate-soft);border-radius:999px;padding:4px;margin:14px 0 4px}
.vtabs button{border:0;background:none;border-radius:999px;min-height:40px;cursor:pointer;font-size:15px;color:var(--muted)}
.vtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}
.daynav b{font-size:17px}
.daynav .iconbtn{min-width:44px;padding:0 12px}
/* meal grid: fixed columns, one row per feeding */
.meal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.meal{border-collapse:separate;border-spacing:0;min-width:640px;font-size:14px}
table.meal th,table.meal td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.meal th{background:var(--slate-soft);color:var(--ink);font-weight:500;font-size:12px;padding:8px 6px;position:sticky;top:0;line-height:1.3}
table.meal td{height:46px;vertical-align:middle;padding:0 4px}
table.meal td .cellbtn{display:block}
table.meal td.t,table.meal th.t{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding-left:10px;border-right:1px solid var(--line)}
table.meal th.t{background:var(--slate-soft);z-index:2}
table.meal td.left{text-align:left;padding:0 8px;white-space:normal;min-width:120px;font-size:13px;color:var(--muted)}
table.meal td .cellbtn{width:100%;height:46px;border:0;background:none;cursor:pointer;font-family:var(--f-num);font-size:15px;color:var(--ink)}
table.meal td .cellbtn:hover{background:var(--honey-soft)}
table.meal td.ck .cellbtn{font-size:18px;color:var(--muted)}
table.meal td.ck .cellbtn.on{color:var(--sage);font-weight:700}
table.meal td.gap.long{color:var(--rose);font-weight:500}
table.meal tfoot td{font-weight:700;background:var(--honey-soft);font-family:var(--f-num);border-bottom:0}
table.meal tfoot td.t{background:var(--honey-soft)}
.cmp{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;font-size:14px}
.cmp > div{padding:9px 6px;border-bottom:1px solid var(--line)}
.cmp .h{color:var(--muted);font-size:12px}
.cmp .up,.cmp .down{color:var(--ink);font-weight:700}
.cmp button{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--slate);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.kpi .v{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.kpi .d{font-size:14px}
.empty button{margin-top:10px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:16px}

/* med timers */
.medrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.medrow:last-child{border-bottom:0}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--sage-soft);color:var(--sage)}
.pill.wait{background:var(--honey-soft);color:var(--ink)}

/* stage track */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stage{padding:10px 8px 8px;border-top:4px solid var(--line);font-size:13px}
.stage b{display:block;font-size:14px}
.stage.now{border-top-color:var(--slate)}
.stage.now b{color:var(--slate)}
.stage ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12px}

.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.check input{width:20px;height:20px}

svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;min-height:56px;cursor:pointer;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button i{font-style:normal;font-size:20px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] i{transform:translateY(-1px)}

/* sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:720px;max-height:92vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(10,15,22,.45)}
.sheet-in{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{font-size:18px;margin:0}
.field{margin:12px 0}
.field > label,.field > .lab{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=datetime-local],.field input[type=date],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--honey-soft);border-radius:var(--radius-sm);padding:11px 12px;font-size:16px;min-height:46px}
.field textarea{min-height:70px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:9px 12px;cursor:pointer;min-height:42px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#131921}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#131921}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:500;min-height:46px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);flex:1}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.warnline{font-size:13px;color:var(--rose);margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.ask textarea{width:100%;border:1px solid var(--line);background:var(--honey-soft);border-radius:var(--radius-sm);padding:12px;min-height:80px;font-size:16px}
.answer{white-space:pre-wrap;font-size:15px;margin-top:10px}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:4px 0}
a{color:var(--slate)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b id="bname">小月亮</b><span id="bage">先在设置里填宝宝生日</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="status" id="status"><span class="dot"></span>本机保存</span>
      <button class="iconbtn" data-act="settings" aria-label="设置">设置</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="主导航"><div class="in">
  <button data-tab="today"><i aria-hidden="true">☀︎</i>今天</button>
  <button data-tab="log"><i aria-hidden="true">≡</i>记录</button>
  <button data-tab="mom"><i aria-hidden="true">♡</i>妈妈</button>
  <button data-tab="grow"><i aria-hidden="true">↗</i>成长</button>
  <button data-tab="learn"><i aria-hidden="true">?</i>问答</button>
</div></nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============ 云端协作配置（Supabase） ============
   在 Supabase 后台 Project Settings → API（或 Data API）里复制下面两项。
   只能填 anon / publishable 公开 key（设计上就是给浏览器用的，安全靠数据库的行级权限 RLS）。
   绝对不要填 service_role / secret key —— 它能绕过所有权限。
   保持占位符不改，网站就以“仅本机保存”模式运行。 */
const SUPABASE_URL = "https://gbhvqlraimmignhoczww.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiaHZxbHJhaW1taWduaG9jend3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODY5MzAsImV4cCI6MjEwNzM2MjkzMH0.Y9ZzQKGChGqnLj-69Bnljgb8BVgXbOEuHbbKt6Z5bBE";
// 国内若 jsDelivr 不稳定：把这个文件下载下来放进仓库，改成 "./supabase.js"
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const H = 3600e3, D = 86400e3;
const pad = n => String(n).padStart(2, "0");
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const toInput = ts => { const d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); };
const fromInput = v => v ? new Date(v).getTime() : null;
function dur(ms){ if (ms < 0) ms = 0; const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? `${h}小时${m % 60}分` : `${m}分钟`; }
function weekday(ts){ return "周" + "日一二三四五六"[new Date(ts).getDay()]; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400); }
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;

/* ============ state & storage ============ */
const LS_KEY = "xiaoyueliang.v1";
const S = {
  entries: [],
  settings: { babyName: "", birth: "", medIntervals: [{ name: "布洛芬", hours: "" }, { name: "泰诺", hours: "" }], checkups: {} },
  mode: "local", col: null, prof: null, sample: null,
  tab: "today", filter: "all", q: "",
  logView: "meal", mealDay: null, gran: "day", metric: "sleep"
};
function loadLocal(){
  try { const o = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (o) { S.entries = Array.isArray(o.entries) ? o.entries : []; S.settings = { ...S.settings, ...(o.settings || {}) }; }
  } catch (e) { /* storage may be unavailable; start empty */ }
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({ entries: S.entries, settings: S.settings })); } catch (e) {} }
function cloudFail(){ S.mode = "local"; S.col = null; S.prof = null; renderStatus(); toast("云端保存失败，记录已存在本设备"); }

async function waitForClaude(){
  for (let i = 0; i < 30; i++) { if (window.claude && typeof window.claude.use === "function") return true; await new Promise(r => setTimeout(r, 100)); }
  return false;
}
async function initCloud(){
  if (!(await waitForClaude())) return;
  claude.use("sample").then(s => { S.sample = s; if (S.tab === "learn") render(); }).catch(() => {});
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const prof = db.doc("data/users/" + uid + "/profile");
    const col = prof.collection("entries");
    const [ps, qs] = await Promise.all([prof.get(), col.limit(1000).get()]);
    const map = new Map(qs.docs.map(d => { const v = { ...d.data() }; return [v.id, v]; }));
    const toUpload = [];
    for (const e of S.entries) { const c = map.get(e.id); if (!c || (e.updated || 0) > (c.updated || 0)) { map.set(e.id, e); toUpload.push(e); } }
    if (ps.exists && ps.data().settings) S.settings = { ...S.settings, ...ps.data().settings };
    S.entries = [...map.values()]; S.col = col; S.prof = prof; S.mode = "cloud";
    saveLocal(); render();
    for (const e of toUpload) await col.doc(e.id).set(JSON.parse(JSON.stringify(e)));
    if (!ps.exists) await prof.set({ settings: S.settings });
  } catch (err) { S.mode = "local"; S.col = null; S.prof = null; renderStatus(); }
}
// Strip local-only bookkeeping fields before anything leaves the device
function clean(e){ const o = JSON.parse(JSON.stringify(e)); delete o._dirty; delete o.by; return o; }

/* One place that decides where changes go: family cloud (Supabase), Claude db, or local only */
async function persist(changed = [], deleted = []){
  if (S.mode === "family") {
    changed.forEach(e => { e._dirty = true; });
    if (deleted.length) saveTombs(loadTombs().concat(deleted.map(e => ({ id: e.id, type: e.type, ts: e.ts }))));
    saveLocal(); render(); syncNow(); return;
  }
  saveLocal(); render();
  if (S.col) { try { for (const e of changed) await S.col.doc(e.id).set(clean(e)); for (const e of deleted) await S.col.doc(e.id).delete(); } catch (err) { cloudFail(); } }
}
async function putEntry(e){
  e.updated = Date.now();
  const i = S.entries.findIndex(x => x.id === e.id);
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
  await persist([e]);
}
async function removeEntry(id){
  const gone = S.entries.filter(x => x.id === id);
  S.entries = S.entries.filter(x => x.id !== id);
  await persist([], gone);
}
async function saveSettings(){
  saveLocal(); render();
  if (S.mode === "family" && SB.family) {
    const { error } = await SB.client.from("families").update({ settings: JSON.parse(JSON.stringify(S.settings)) }).eq("id", SB.family.id);
    if (error) toast("设置暂时没同步到云端，联网后再保存一次");
    return;
  }
  if (S.prof) { try { await S.prof.set({ settings: JSON.parse(JSON.stringify(S.settings)) }); } catch (err) { cloudFail(); } }
}

/* ============ Supabase family sync ============ */
const SB = { configured: false, client: null, uid: undefined, user: null, family: null, members: {}, channel: null, syncing: false, again: false };
const SYNC_KEY = LS_KEY + ".sync", TOMB_KEY = LS_KEY + ".tomb";
const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const loadTombs = () => loadJSON(TOMB_KEY, []), saveTombs = v => saveJSON(TOMB_KEY, v);

function initSupabase(){
  SB.configured = /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_URL.includes("YOUR-") && !SUPABASE_ANON_KEY.includes("YOUR-");
  if (!SB.configured) return false;
  const tag = document.createElement("script");
  tag.src = SUPABASE_JS;
  tag.onload = () => {
    SB.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    SB.client.auth.onAuthStateChange((_evt, session) => {
      const uid = session?.user?.id || null;
      SB.user = session?.user || null;
      if (uid === SB.uid) return;
      SB.uid = uid;
      setTimeout(afterAuth, 0); // don't call Supabase inside its own auth callback
    });
  };
  tag.onerror = () => { toast("云端组件加载失败，先用本机记录"); renderStatus(); };
  document.head.appendChild(tag);
  return true;
}
async function afterAuth(){
  teardownRealtime(); SB.family = null; SB.members = {};
  if (!SB.user) { S.mode = "local"; render(); refreshSettingsIfOpen(); return; }
  const { data, error } = await SB.client.from("family_members").select("family_id, families(*)").eq("user_id", SB.user.id).limit(1);
  if (error) { toast("连接云端失败，先用本机记录"); render(); return; }
  if (data.length && data[0].families) await enterFamily(data[0].families);
  else { S.mode = "local"; render(); refreshSettingsIfOpen(); }
}
async function enterFamily(fam){
  const sync = loadJSON(SYNC_KEY, {});
  if (sync.familyId !== fam.id) {
    // First time this device joins this family: drop demo data, upload everything else once
    S.entries = S.entries.filter(e => !e.demo);
    S.entries.forEach(e => { e._dirty = true; });
    saveTombs([]);
    saveJSON(SYNC_KEY, { familyId: fam.id, lastPull: null });
  }
  SB.family = fam; S.mode = "family";
  if (fam.settings && Object.keys(fam.settings).length) S.settings = { ...S.settings, ...fam.settings };
  else await SB.client.from("families").update({ settings: JSON.parse(JSON.stringify(S.settings)) }).eq("id", fam.id);
  saveLocal();
  await loadMembers();
  await syncNow();
  setupRealtime();
  render(); refreshSettingsIfOpen();
}
async function loadMembers(){
  const { data } = await SB.client.from("family_members").select("user_id, display_name").eq("family_id", SB.family.id);
  SB.members = Object.fromEntries((data || []).map(m => [m.user_id, m.display_name || "家人"]));
}
function toRow(e){ return { family_id: SB.family.id, id: e.id, type: e.type, ts: e.ts, updated: e.updated || Date.now(), deleted: false, data: clean(e) }; }
function applyRow(r){
  const i = S.entries.findIndex(x => x.id === r.id);
  if (i >= 0 && S.entries[i]._dirty) return; // local unsent edit wins until it is pushed
  if (r.deleted) { if (i >= 0) S.entries.splice(i, 1); return; }
  const e = { ...r.data, id: r.id, type: r.type, ts: Number(r.ts), updated: Number(r.updated), by: r.updated_by };
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
}
async function syncNow(){
  if (!SB.family) return;
  if (SB.syncing) { SB.again = true; return; }
  SB.syncing = true;
  try {
    // 1) push local changes and deletions
    const dirty = S.entries.filter(e => e._dirty), tombs = loadTombs();
    const rows = dirty.map(toRow).concat(tombs.map(t => ({ family_id: SB.family.id, id: t.id, type: t.type || "deleted", ts: t.ts || 0, updated: Date.now(), deleted: true, data: {} })));
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await SB.client.from("entries").upsert(rows.slice(i, i + 200), { onConflict: "family_id,id" });
      if (error) throw error;
    }
    dirty.forEach(e => { delete e._dirty; e.by = SB.user.id; }); saveTombs([]);
    // 2) pull everything changed on the server since last pull (server clock, not phone clock)
    const sync = loadJSON(SYNC_KEY, {});
    let from = 0, newest = sync.lastPull;
    for (;;) {
      let q = SB.client.from("entries").select("*").eq("family_id", SB.family.id).order("server_updated", { ascending: true }).range(from, from + 999);
      if (sync.lastPull) q = q.gte("server_updated", sync.lastPull);
      const { data, error } = await q; if (error) throw error;
      data.forEach(applyRow);
      if (data.length) newest = data[data.length - 1].server_updated;
      if (data.length < 1000) break; from += 1000;
    }
    saveJSON(SYNC_KEY, { familyId: SB.family.id, lastPull: newest });
    saveLocal(); render();
  } catch (err) {
    renderStatus(); // unsent records stay marked and retry on the next sync
  } finally {
    SB.syncing = false;
    if (SB.again) { SB.again = false; syncNow(); }
  }
}
function setupRealtime(){
  teardownRealtime();
  SB.channel = SB.client.channel("family-" + SB.family.id)
    .on("postgres_changes", { event: "*", schema: "public", table: "entries", filter: "family_id=eq." + SB.family.id }, payload => {
      if (payload.new && payload.new.id) { applyRow(payload.new); saveLocal(); if (!$("#sheet").open) render(); else renderStatus(); }
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "families", filter: "id=eq." + SB.family.id }, payload => {
      if (payload.new?.settings) { S.settings = { ...S.settings, ...payload.new.settings }; saveLocal(); if (!$("#sheet").open) render(); }
    })
    .subscribe();
}
function teardownRealtime(){ if (SB.channel && SB.client) { SB.client.removeChannel(SB.channel); SB.channel = null; } }
function refreshSettingsIfOpen(){ if ($("#sheet").open && $("#s_name")) openSettings(); }

    case "bmed": p.push(e.cat || "", e.name || "", e.dose || ""); break;
    case "mmed": p.push(e.cat || "", e.name || "", e.dose || ""); break;

function birthTs(){ return S.settings.birth ? new Date(S.settings.birth + "T00:00:00").getTime() : null; }
function babyAgeDays(at = Date.now()){ const b = birthTs(); return b == null ? null : Math.floor((startOfDay(at) - b) / D); }
function ageText(){
  const d = babyAgeDays(); if (d == null) return "先在设置里填宝宝生日";
  if (d < 0) return `距预产期还有 ${-d} 天`;
  const b = new Date(birthTs()), n = new Date();
  let m = (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth(); if (n.getDate() < b.getDate()) m--;
  const stage = STAGES.find(s => d < s.untilDays) || STAGES[STAGES.length - 1];
  const age = d < 60 ? `出生第 ${d + 1} 天` : m < 24 ? `${m} 个月` : `${Math.floor(m / 12)} 岁 ${m % 12} 个月`;
  return `${age} · ${stage.name}`;
}

];
function checkupDate(c){ const b = birthTs(); if (b == null) return null; if (c.days) return b + c.days * D; const d = new Date(b); d.setMonth(d.getMonth() + c.m); return d.getTime(); }
function nextCheckup(){ const done = S.settings.checkups || {}; return CHECKUPS.map(c => ({ ...c, at: checkupDate(c) })).find(c => c.at && !done[c.k] && c.at > Date.now() - 14 * D); }

/* ============ derived data ============ */
const byTime = (a, b) => b.ts - a.ts;
const last = (pred) => S.entries.filter(pred).sort(byTime)[0];
const within = (ms) => S.entries.filter(e => e.ts >= Date.now() - ms && e.ts <= Date.now() + 60e3);

function suggestSide(f){
  if (!f || !["亲喂", "混合"].includes(f.method)) return null;
  const l = +f.left || 0, r = +f.right || 0;
  if (!l && !r) return null;
  if (l && !r) return "右侧"; if (r && !l) return "左侧";
  return l < r ? "左侧" : "右侧";
}
function expectedDiapers(dayIdx){ // common lactation guidance for the first week
  if (dayIdx == null || dayIdx > 30) return { wet: 6, poop: null };
  const d = dayIdx + 1;
  if (d <= 5) return { wet: d, poop: Math.min(d, 3) };
  return { wet: 6, poop: 3 };
}
function sleepMsIn(fromTs, toTs){
  let t = 0;
  for (const e of S.entries) if (e.type === "sleep") {
    const s = e.ts, en = e.end || Date.now();
    const a = Math.max(s, fromTs), b = Math.min(en, toTs); if (b > a) t += b - a;
  }
  return t;
}
function medStatus(){
  const out = [];
  const meds = S.entries.filter(e => e.type === "mmed" && e.ts > Date.now() - 2 * D).sort(byTime);
  const seen = new Set();
  for (const m of meds) {
    const name = (m.name || m.cat || "").trim(); if (!name || seen.has(name)) continue; seen.add(name);
    const rule = (S.settings.medIntervals || []).find(r => r.name && name.includes(r.name) && num(r.hours));
    const next = rule ? m.ts + num(rule.hours) * H : null;
    out.push({ name, at: m.ts, next, count24: meds.filter(x => (x.name || x.cat || "").trim() === name && x.ts > Date.now() - D).length });
  }
  return out;
}

/* ---------- 趋势对比：日 / 周 ---------- */
const METRICS = {
  sleep:   { label: "睡眠时长", unit: "小时", dec: 1, color: "var(--slate)", day: (a, b) => sleepMsIn(a, b) / H },
  longest: { label: "最长一觉", unit: "小时", dec: 1, color: "var(--slate)", max: true,
             day: (a, b) => Math.max(0, ...S.entries.filter(e => e.type === "sleep" && e.end && e.ts >= a && e.ts < b).map(e => (e.end - e.ts) / H)) },
  ml:      { label: "瓶喂奶量", unit: "ml", dec: 0, color: "var(--honey)", day: (a, b) => inRange(a, b, "feed").reduce((s, e) => s + (+e.ml || 0), 0) },
  nurse:   { label: "亲喂时长", unit: "分钟", dec: 0, color: "var(--honey)", day: (a, b) => inRange(a, b, "feed").reduce((s, e) => s + (+e.left || 0) + (+e.right || 0), 0) },
  feeds:   { label: "喂奶次数", unit: "次", dec: 1, color: "var(--honey)", day: (a, b) => inRange(a, b, "feed").filter(e => e.method !== "吸奶").length },
  wet:     { label: "湿尿布", unit: "次", dec: 1, color: "var(--sky)", day: (a, b) => inRange(a, b, "diaper").filter(e => e.pee).length },
  poop:    { label: "大便", unit: "次", dec: 1, color: "var(--sky)", day: (a, b) => inRange(a, b, "diaper").filter(e => e.poop).length },
  pump:    { label: "吸奶量", unit: "ml", dec: 0, color: "#9B7BB8", day: (a, b) => inRange(a, b, "feed").filter(e => e.method === "吸奶").reduce((s, e) => s + (+e.ml || 0), 0) }
};
function inRange(a, b, type){ return S.entries.filter(e => e.type === type && e.ts >= a && e.ts < b); }
function hasData(a, b){ return S.entries.some(e => e.ts >= a && e.ts < b); }
function weekStart(ts){ const d0 = startOfDay(ts); const wd = (new Date(d0).getDay() + 6) % 7; return d0 - wd * D; }
// one bucket = a day, or a week reported as average per recorded day
function buckets(gran, n){
  const out = [], now = Date.now();
  for (let i = n - 1; i >= 0; i--) {
    if (gran === "day") { const a = startOfDay(now) - i * D; out.push({ a, b: a + D, label: dayKey(a).slice(5).replace("-", "/"), partial: i === 0 }); }
    else { const a = weekStart(now) - i * 7 * D; out.push({ a, b: a + 7 * D, label: dayKey(a).slice(5).replace("-", "/"), partial: i === 0 }); }
  }
  return out;
}
function metricValue(m, bk){
  const M = METRICS[m];
  if (bk.b - bk.a === D) return hasData(bk.a, bk.b) ? M.day(bk.a, bk.b) : null;
  const vals = [];
  for (let t = bk.a; t < bk.b && t <= Date.now(); t += D) if (hasData(t, t + D)) vals.push(M.day(t, t + D));
  if (!vals.length) return null;
  return M.max ? Math.max(...vals) : vals.reduce((x, y) => x + y, 0) / vals.length;
}
function fmtV(m, v){ return v == null ? "–" : (Math.round(v * 10 ** METRICS[m].dec) / 10 ** METRICS[m].dec).toString(); }
function barChart(m, bks, vals){
  const W = 360, Hh = 170, P = { l: 8, r: 8, t: 18, b: 22 }, M = METRICS[m];
  const max = Math.max(1, ...vals.filter(v => v != null));
  const bw = (W - P.l - P.r) / bks.length;
  const done = vals.filter((v, i) => v != null && !bks[i].partial);
  const avg = done.length ? done.reduce((a, b) => a + b, 0) / done.length : null;
  const Y = v => Hh - P.b - v / max * (Hh - P.t - P.b);
  let g = "";
  bks.forEach((bk, i) => {
    const v = vals[i], x = P.l + i * bw + bw * .15, w = bw * .7;
    if (v != null) {
      g += `<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(Hh - P.b - Y(v)).toFixed(1)}" rx="3" fill="${M.color}" ${bk.partial ? 'fill-opacity=".45"' : ""}/>`;
      if (bks.length <= 14) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle">${fmtV(m, v)}</text>`;
    }
    if (bks.length <= 8 || i % 2 === (bks.length - 1) % 2) g += `<text x="${(x + w / 2).toFixed(1)}" y="${Hh - 6}" text-anchor="middle">${bk.label}</text>`;
  });
  if (avg != null) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-opacity=".5"/>`;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${M.label}${S.gran === "day" ? "每天" : "每周日均"}柱状图，虚线为平均值 ${avg == null ? "无" : fmtV(m, avg)}${M.unit}">${g}</svg></div>
  <div class="legend"><span style="--c:${M.color}">${S.gran === "day" ? "每天" : "每周日均（日期为周一）"}</span><span style="--c:${M.color};opacity:.5">进行中</span><span style="--c:transparent">┅ 虚线为平均</span></div>`;
}
function viewTrend(){
  const n = S.gran === "day" ? 14 : 8;
  const bks = buckets(S.gran, n);
  const vals = bks.map(bk => metricValue(S.metric, bk));
  const M = METRICS[S.metric];
  const cur = vals[vals.length - 1], prev = vals[vals.length - 2];
  const delta = (c, p) => (c == null || p == null) ? "" : c - p;
  const pct = (c, p) => (c == null || p == null || p === 0) ? "" : ` (${c >= p ? "+" : ""}${Math.round((c - p) / p * 100)}%)`;
  const per = S.gran === "day" ? ["今天", "昨天"] : ["本周", "上周"];
  const dv = delta(cur, prev);
  // comparison table across all metrics
  const cmpRows = Object.keys(METRICS).map(k => {
    const c = metricValue(k, bks[bks.length - 1]), p = metricValue(k, bks[bks.length - 2]);
    if (!c && !p) return ""; // hide metrics with no data in either period
    const d = delta(c, p);
    return `<div><button data-metric="${k}">${METRICS[k].label}</button> <span class="small muted">${METRICS[k].unit}</span></div>
      <div class="num">${fmtV(k, c)}</div><div class="num">${fmtV(k, p)}</div>
      <div class="num ${d === "" || Math.abs(d) < 1e-9 ? "" : d > 0 ? "up" : "down"}">${d === "" ? "–" : (d > 0 ? "↑" : d < 0 ? "↓" : "") + fmtV(k, Math.abs(d))}</div>`;
  }).join("");
  if (!S.entries.length) return `<div class="empty">还没有记录。记录几天后这里会显示趋势。</div>`;
  return `
  <div class="chips" role="group" aria-label="时间粒度" style="margin-top:12px">
    <button class="chip" data-gran="day" aria-pressed="${S.gran === "day"}">按天（14 天）</button>
    <button class="chip" data-gran="week" aria-pressed="${S.gran === "week"}">按周（8 周）</button>
  </div>
  <div class="chips" role="group" aria-label="指标">${Object.entries(METRICS).map(([k, x]) => `<button class="chip" data-metric="${k}" aria-pressed="${S.metric === k}">${x.label}</button>`).join("")}</div>
  <div class="panel">
    <div class="small muted">${M.label} · ${per[0]}${S.gran === "week" ? (M.max ? "最长" : "日均") : ""}${bks[bks.length - 1].partial ? "（进行中）" : ""}</div>
    <div class="kpi"><span class="v">${fmtV(S.metric, cur)}</span><span class="muted">${M.unit}</span>
      ${dv !== "" ? `<span class="d ${dv > 0 ? "up" : dv < 0 ? "down" : ""}" style="color:var(--muted)">比${per[1]} ${dv > 0 ? "+" : dv < 0 ? "−" : "±"}${fmtV(S.metric, Math.abs(dv))}${pct(cur, prev)}</span>` : ""}</div>
    ${barChart(S.metric, bks, vals)}
  </div>
  <h2>${per[0]} vs ${per[1]}</h2>
  <div class="panel"><div class="cmp">
    <div class="h">指标</div><div class="h">${per[0]}${S.gran === "week" ? "日均" : ""}</div><div class="h">${per[1]}${S.gran === "week" ? "日均" : ""}</div><div class="h">变化</div>
    ${cmpRows}
  </div>
  <p class="small muted" style="margin-top:8px">${S.gran === "week" ? "周数据按“有记录的天数”求日均（最长一觉取一周内最长），避免漏记的日子拉低平均。" : "今天还没过完，和昨天比会偏低，看趋势更准。"}箭头只表示多或少，不代表好坏：例如喂奶次数随月龄减少是正常的。点指标名可切换上方图表。</p></div>`;
}

/* ---- charts ---- */
function lineChart(points, opts){
  const W = 360, Hh = 150, P = { l: 34, r: 10, t: 12, b: 22 };
  if (points.length < 2) return `<p class="small muted">至少记录两次后会显示趋势图。</p>`;
  const xs = points.map(p => p.t), ys = points.map(p => p.v);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (opts.min != null) y0 = Math.min(y0, opts.min); if (opts.max != null) y1 = Math.max(y1, opts.max);
  if (y1 === y0) { y1 += 1; y0 -= 1; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const X = t => P.l + (t - x0) / ((x1 - x0) || 1) * (W - P.l - P.r), Y = v => Hh - P.b - (v - y0) / (y1 - y0) * (Hh - P.t - P.b);
  const path = points.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const fmt = v => Math.round(v * 10) / 10;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${esc(opts.label)}：从 ${fmt(ys[0])} 到 ${fmt(ys[ys.length - 1])}${esc(opts.unit)}">
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(y1)}" y2="${Y(y1)}" stroke="var(--line)"/><line x1="${P.l}" x2="${W - P.r}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="var(--line)"/>
    <text x="4" y="${Y(y1) + 4}">${fmt(y1)}</text><text x="4" y="${Y(y0) + 4}">${fmt(y0)}</text>
    <text x="${P.l}" y="${Hh - 6}">${dayKey(x0).slice(5)}</text><text x="${W - P.r}" y="${Hh - 6}" text-anchor="end">${dayKey(x1).slice(5)}</text>
    <path d="${path}" fill="none" stroke="${opts.color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="${opts.color}"/>`).join("")}</svg></div>`;
}
function sleepBarcode(){
  const W = 360, rowH = 20, gap = 6, L = 42, days = 7, now = Date.now();
  const rows = []; for (let i = 0; i < days; i++) rows.push(startOfDay(now) - i * D);
  const sleeps = S.entries.filter(e => e.type === "sleep");
  const feeds = S.entries.filter(e => e.type === "feed" && e.method !== "吸奶");
  const scale = (W - L - 8) / D;
  let body = "";
  rows.forEach((d0, i) => {
    const y = 18 + i * (rowH + gap);
    body += `<text x="0" y="${y + 15}">${dayKey(d0).slice(5)}</text><rect x="${L}" y="${y}" width="${W - L - 8}" height="${rowH}" rx="4" fill="var(--slate-soft)"/>`;
    for (const s of sleeps) { const a = Math.max(s.ts, d0), b = Math.min(s.end || now, d0 + D); if (b > a) body += `<rect x="${(L + (a - d0) * scale).toFixed(1)}" y="${y}" width="${Math.max(1.5, (b - a) * scale).toFixed(1)}" height="${rowH}" rx="3" fill="var(--slate)"/>`; }
    for (const f of feeds) if (f.ts >= d0 && f.ts < d0 + D) body += `<rect x="${(L + (f.ts - d0) * scale - 1).toFixed(1)}" y="${y + rowH - 6}" width="3" height="6" fill="var(--honey)"/>`;
  });
  [0, 6, 12, 18, 24].forEach(h => body += `<text x="${L + h * H * scale}" y="12" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${h}点</text>`);
  const total = 18 + days * (rowH + gap);
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${total}" width="100%" role="img" aria-label="最近7天睡眠时间分布图，深色为睡眠，黄色刻度为喂奶">${body}</svg></div>
  <div class="legend"><span style="--c:var(--slate)">睡眠</span><span style="--c:var(--honey)">喂奶</span></div>`;
}

let draft = null;
function openForm(type, existing, preset){
  const T = TYPES[type];
  draft = existing ? { ...existing } : { id: newId(), type, ts: Date.now(), ...preset };
  if (!existing) for (const f of T.fields) if (f.def !== undefined && draft[f.k] === undefined) draft[f.k] = f.def;
  drawForm(); const d = $("#sheet"); if (!d.open) d.showModal();
}
function drawForm(focusKey){
  const T = TYPES[draft.type], isNew = !S.entries.some(e => e.id === draft.id);
  const fieldsHTML = T.fields.filter(f => !f.show || f.show(draft)).map(f => {
    const v = draft[f.k], id = "f_" + f.k;
    let inner = "";
    if (f.type === "seg") inner = `<div class="lab" id="${id}">${f.label}</div><div class="seg" role="group" aria-labelledby="${id}">${f.opts.map(o => `<button type="button" data-seg="${f.k}" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join("")}</div>`;
    else if (f.type === "check") inner = `<label class="check"><input type="checkbox" data-f="${f.k}" ${v ? "checked" : ""}>${f.label}</label>`;
    else if (f.type === "num") inner = `<label for="${id}">${f.label}</label><input id="${id}" type="number" inputmode="decimal" step="${f.step || 1}" min="0" data-f="${f.k}" value="${v ?? ""}" placeholder="${esc(f.ph || "")}">`;
    else if (f.type === "datetime") inner = `<label for="${id}">${f.label}</label><input id="${id}" type="datetime-local" data-f="${f.k}" data-kind="dt" value="${v ? toInput(v) : ""}">`;
    else if (f.type === "range") inner = `<label for="${id}">${f.label}</label><div class="range"><input id="${id}" type="range" min="${f.min}" max="${f.max}" data-f="${f.k}" value="${v ?? Math.round((f.min + f.max) / 2)}"><output class="num" style="min-width:24px">${v ?? "–"}</output></div>`;
    else if (f.type === "area") inner = `<label for="${id}">${f.label}</label><textarea id="${id}" data-f="${f.k}" placeholder="${esc(f.ph || "")}">${esc(v || "")}</textarea>`;
    else inner = `<label for="${id}">${f.label}</label><input id="${id}" type="text" data-f="${f.k}" value="${esc(v || "")}" ${f.list ? `list="${f.list}"` : ""} placeholder="${esc(f.ph || "")}">`;
    return `<div class="field" ${f.half ? 'data-half="1"' : ""}>${inner}</div>`;
  });
  // pair half-width fields
  const out = []; for (let i = 0; i < fieldsHTML.length; i++) {
    if (fieldsHTML[i].includes('data-half="1"') && fieldsHTML[i + 1]?.includes('data-half="1"')) { out.push(`<div class="row2">${fieldsHTML[i]}${fieldsHTML[i + 1]}</div>`); i++; } else out.push(fieldsHTML[i]);
  }
  const fl = flags(draft);
  $("#sheetIn").innerHTML = `<div class="sheet-head"><h3 id="sheetTitle">${T.icon} ${isNew ? "记录" : "修改"}${T.label}</h3><button class="iconbtn" data-act="close" aria-label="关闭">关闭</button></div>
    <div class="field"><label for="f_ts">${draft.type === "sleep" ? "入睡时间" : "时间"}</label><input id="f_ts" type="datetime-local" data-f="ts" data-kind="dt" value="${toInput(draft.ts)}"></div>
    ${out.join("")}
    ${fl.map(f => `<div class="warnline" role="alert">${esc(f)}</div>`).join("")}
    <datalist id="medlist"><option value="布洛芬"><option value="泰诺（对乙酰氨基酚）"><option value="复合维生素"><option value="铁剂"><option value="钙片"></datalist>
    <div class="btns"><button class="btn primary" data-act="save">保存</button>${isNew ? "" : `<button class="btn danger" data-act="del">删除</button>`}</div>`;
  if (focusKey) { const el = $("#sheetIn").querySelector(`[data-seg="${focusKey}"][aria-pressed="true"]`); el && el.focus(); }
}
function readDraftInputs(){
  $("#sheetIn").querySelectorAll("[data-f]").forEach(el => {
    const k = el.dataset.f;
    if (el.type === "checkbox") draft[k] = el.checked;
    else if (el.dataset.kind === "dt") draft[k] = fromInput(el.value);
    else if (el.type === "number" || el.type === "range") draft[k] = num(el.value);
    else draft[k] = el.value.trim();
  });
  if (!draft.ts) draft.ts = Date.now();
}
function pickType(){
  draft = null;
  $("#sheetIn").innerHTML = `<div class="sheet-head"><h3 id="sheetTitle">补记哪一类？</h3><button class="iconbtn" data-act="close" aria-label="关闭">关闭</button></div>
  <div class="quick">${Object.entries(TYPES).map(([k, t]) => `<button data-add="${k}"><i>${t.icon}</i>${t.label}</button>`).join("")}</div>`;
  const d = $("#sheet"); if (!d.open) d.showModal();
}

/* ============ settings sheet ============ */
function openSettings(){
  const st = S.settings;
  $("#sheetIn").innerHTML = `<div class="sheet-head"><h3 id="sheetTitle">设置</h3><button class="iconbtn" data-act="close" aria-label="关闭">关闭</button></div>
  <div class="row2"><div class="field"><label for="s_name">宝宝小名</label><input id="s_name" type="text" value="${esc(st.babyName)}"></div>
  <div class="field"><label for="s_birth">出生日期</label><input id="s_birth" type="date" value="${esc(st.birth)}"></div></div>
  <div class="field"><div class="lab">妈妈用药的最短间隔（按医嘱或说明书填写）</div>
    <div id="medRules">${(st.medIntervals || []).map((r, i) => `<div class="row2" style="margin-bottom:6px"><input type="text" aria-label="药名" data-mr="${i}" data-mk="name" value="${esc(r.name)}" placeholder="药名"><input type="number" inputmode="decimal" aria-label="间隔小时" data-mr="${i}" data-mk="hours" value="${esc(r.hours)}" placeholder="间隔（小时）"></div>`).join("")}</div>
    <button class="chip" data-act="addrule">＋ 添加一种药</button></div>
  <div class="btns"><button class="btn primary" data-act="savesettings">保存设置</button></div>

  <h2>家庭协作</h2>
  ${familyHTML()}
  <h2>数据</h2>
  <p class="small muted">${S.mode === "family" ? "记录保存在家庭云端，每台设备都有一份离线副本；没网时照常记录，联网后自动同步。" : S.mode === "cloud" ? "记录已同步到你的 Claude 账号，同时在本设备留有副本。" : "记录目前只保存在这台设备的浏览器里。换手机或清理浏览器数据会丢失，建议每周导出一次备份。"}</p>
  <div class="btns"><button class="btn" data-act="export">导出备份（JSON）</button><button class="btn" data-act="csv">导出表格（CSV）</button><button class="btn" data-act="import">从备份恢复</button></div>
  <div class="btns"><button class="btn" data-act="demo">载入演示数据</button><button class="btn" data-act="cleardemo">清除演示数据</button><button class="btn danger" data-act="clearall">清空全部记录</button></div>
  <h2>显示</h2>
  <div class="seg" role="group" aria-label="外观">${[["", "跟随系统"], ["light", "浅色"], ["dark", "深色（夜里喂奶）"]].map(([v, l]) => `<button data-theme-set="${v}" aria-pressed="${(document.documentElement.dataset.theme || "") === v}">${l}</button>`).join("")}</div>`;
  const d = $("#sheet"); if (!d.open) d.showModal();
}
function readSettingsInputs(){
  S.settings.babyName = $("#s_name")?.value.trim() ?? S.settings.babyName;
  S.settings.birth = $("#s_birth")?.value ?? S.settings.birth;
  const rules = []; document.querySelectorAll("[data-mr]").forEach(el => { const i = +el.dataset.mr; (rules[i] ||= { name: "", hours: "" })[el.dataset.mk] = el.value.trim(); });
  S.settings.medIntervals = rules.filter(r => r && (r.name || r.hours));
}

/* ============ import / export ============ */
async function offerFile(filename, text, mime){
  let dl = null;
  if (window.claude?.use) dl = await claude.use("downloads").catch(() => null);
  if (dl) { try { await dl.save({ filename, data: text }); return; } catch (e) { if (e && e.code !== "unavailable") { toast("没有保存文件"); return; } } }
  try { const url = URL.createObjectURL(new Blob([text], { type: mime })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
  catch (e) { toast("当前环境无法下载文件"); }
}
function toCSV(){
  const rows = [["日期", "时间", "类型", "内容", "结束时间", "备注"]];
  for (const e of S.entries.slice().sort((a, b) => a.ts - b.ts)) rows.push([dayKey(e.ts), hm(e.ts), TYPES[e.type]?.label || e.type, summary(e), e.end ? dayKey(e.end) + " " + hm(e.end) : "", e.note || ""]);
  return "\ufeff" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
}
async function importJSON(file){
  try {
    const o = JSON.parse(await file.text());
    if (!Array.isArray(o.entries)) throw new Error("bad");
    const valid = o.entries.filter(e => e && typeof e.id === "string" && TYPES[e.type] && typeof e.ts === "number");
    const ids = new Set(S.entries.map(e => e.id));
    const added = valid.filter(e => !ids.has(e.id));
    if (o.settings && typeof o.settings === "object") S.settings = { ...S.settings, ...o.settings };
    S.entries.push(...added);
    await persist(added); await saveSettings(); toast(`已恢复 ${added.length} 条记录`);
  } catch (e) { toast("文件格式不对：请选择从这里导出的 JSON 备份"); }
}
async function loadDemo(){
  const now = Date.now(), list = [];
  if (!S.settings.birth) { const b = new Date(now - 24 * D); S.settings.birth = dayKey(b.getTime()); }
  const span = 16; let t = now - span * D, side = 0;
  while (t < now - 40 * 60e3) {
    const bottle = Math.random() < .2;
    const grow = 1 - (now - t) / (span * D); // 0 → 1 across the demo period
    list.push(bottle ? { type: "feed", ts: t, method: Math.random() < .5 ? "配方奶" : "母乳瓶喂", ml: 40 + Math.round(grow * 4 + Math.random() * 3) * 10 }
                     : { type: "feed", ts: t, method: "亲喂", [side ? "right" : "left"]: 8 + Math.round(Math.random() * 10) });
    side ^= 1;
    list.push({ type: "diaper", ts: t + 10 * 60e3, pee: true, poop: Math.random() < .35, color: "黄" });
    const s = t + 25 * 60e3, len = (new Date(s).getHours() < 7 || new Date(s).getHours() > 21) ? 100 + grow * 70 + Math.random() * 50 : 40 + Math.random() * 70;
    list.push({ type: "sleep", ts: s, end: s + len * 60e3, where: "婴儿床", how: Math.random() < .5 ? "奶睡" : "抱睡" });
    t += (2.2 + Math.random() * 1.2) * H;
  }
  for (let i = 3; i >= 0; i--) {
    const d0 = startOfDay(now) - i * D;
    list.push({ type: "mbody", ts: d0 + 9 * H, weight: +(64.5 - (3 - i) * .3).toFixed(1), lochia: i > 1 ? "中" : "少", lcolor: "粉/褐", pain: 5 - (3 - i), mood: 2 + (3 - i) % 3, sleepHrs: 4 + (3 - i) * .5 });
    if (d0 + 10 * H < now) list.push({ type: "mmed", ts: d0 + 10 * H, cat: "止疼药", name: "布洛芬", dose: "1片" });
    if (d0 + 16 * H < now) list.push({ type: "mmed", ts: d0 + 16 * H, cat: "止疼药", name: "泰诺", dose: "1片" });
    if (d0 + 10 * H < now) list.push({ type: "mmed", ts: d0 + 10 * H + 60e3, cat: "维生素", name: "复合维生素、铁" });
    if (d0 + 11 * H < now) list.push({ type: "bmed", ts: d0 + 11 * H, cat: "维生素D", name: "维生素D滴剂", dose: "1滴" });
  }
  list.push({ type: "baby", ts: now - 2 * D, weight: 3.42, temp: 36.8 }, { type: "baby", ts: now - 9 * D, weight: 3.18 }, { type: "baby", ts: now - 12 * D, weight: 3.35, length: 50, head: 34 });
  const items = list.filter(e => e.ts < now).map(e => ({ ...e, id: newId() + Math.random().toString(36).slice(2, 4), demo: true, updated: now }));
  if (S.mode === "family") { toast("家庭模式下不能载入演示数据，以免混进真实记录"); return; }
  S.entries.push(...items); await persist(items); await saveSettings();
  toast(`已载入 ${items.length} 条演示记录`);
}
async function removeWhere(pred){
  const gone = S.entries.filter(pred); S.entries = S.entries.filter(e => !pred(e));
  await persist([], gone);
  return gone.length;
}

/* ============ AI ask (sample capability) ============ */
let askCtl = null;
async function ask(){
  const q = $("#askq")?.value.trim(); if (!q || !S.sample) return;
  const out = $("#answer"); out.textContent = "正在思考…";
  askCtl?.abort(); askCtl = new AbortController();
  const ad = babyAgeDays();
  const prompt = `你是一位谨慎、温和的母婴健康科普助手，用简体中文回答新手父母的问题。
要求：依据美国儿科学会（AAP）、WHO、ACOG、CDC 等权威机构的公开建议给出一般性信息；
控制在 250 字以内，分 2–4 个短段落；不做诊断，不给具体药物剂量；
若问题涉及以下危险信号（3个月内发热≥38℃、呼吸困难、嗜睡难叫醒、脱水、产后大出血、胸痛、伤害自己或宝宝的念头等），第一句就明确建议立即就医。
最后一句提醒具体情况以医生意见为准。
${ad != null && ad >= 0 ? `宝宝目前出生 ${ad} 天。` : ""}
问题：${q}`;
  try {
    const r = await S.sample(prompt, { signal: askCtl.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
    out.textContent = r.text;
  } catch (e) {
    out.textContent = e?.code === "not_granted" ? "需要允许这个页面使用 Claude 才能提问。" : e?.code === "rate_limited" ? "提问太频繁了，请稍后再试。" : (e?.text || "暂时没能得到回答，请稍后再试。");
  }
}

/* tap ○ to tick 尿/便 for this meal; tap ✓ to open that diaper record */
async function mealCheck(feedId, kind){
  const r = mealRows().find(x => x.f.id === feedId); if (!r) return;
  if (r[kind].length) { openForm("diaper", r[kind][r[kind].length - 1]); return; }
  const other = r.diapers.find(d => !d[kind]);
  if (other) await putEntry({ ...other, [kind]: true });
  else await putEntry({ id: newId(), type: "diaper", ts: r.f.ts + 60e3, pee: kind === "pee", poop: kind === "poop" });
  toast(kind === "poop" ? "已打勾，点 ✓ 可补充大便颜色" : "已打勾");
}

/* ============ events ============ */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,[data-checkup]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.add) { openForm(t.dataset.add, null, t.dataset.preset ? JSON.parse(t.dataset.preset) : {}); return; }
  if (t.dataset.edit) { const e = S.entries.find(x => x.id === t.dataset.edit); e && openForm(e.type, e); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.logview) { S.logView = t.dataset.logview; render(); return; }
  if (t.dataset.gran) { S.gran = t.dataset.gran; render(); return; }
  if (t.dataset.metric) { S.metric = t.dataset.metric; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (t.dataset.mealday) {
    const cur = S.mealDay ?? startOfDay(Date.now());
    const next = startOfDay(cur + (+t.dataset.mealday) * D + 2 * H); // +2h guards against DST shifts
    S.mealDay = Math.min(next, startOfDay(Date.now())); render(); return;
  }
  if (t.dataset.mealcheck) { await mealCheck(t.dataset.feed, t.dataset.mealcheck); return; }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("已复制：" + t.dataset.copy); } catch (e) { toast("请手动搜索：" + t.dataset.copy); } return; }
  if (t.dataset.seg) { readDraftInputs(); draft[t.dataset.seg] = draft[t.dataset.seg] === t.dataset.v ? null : t.dataset.v; drawForm(t.dataset.seg); return; }
  if (t.dataset.themeSet !== undefined) { const v = t.dataset.themeSet; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; try { localStorage.setItem(LS_KEY + ".theme", v); } catch (e) {} openSettings(); return; }
  switch (t.dataset.act) {
    case "close": $("#sheet").close(); break;
    case "save": { readDraftInputs(); const e = { ...draft };
      if (e.type === "sleep" && e.end && e.end < e.ts) { toast("醒来时间要晚于入睡时间"); return; }
      $("#sheet").close(); await putEntry(e); toast("已保存"); break; }
    case "del": if (confirm("删除这条记录？")) { $("#sheet").close(); await removeEntry(draft.id); toast("已删除"); } break;
    case "sleepnow": { if (last(e => e.type === "sleep" && !e.end)) { toast("已经在记录睡眠了"); return; } await putEntry({ id: newId(), type: "sleep", ts: Date.now() }); toast("开始记录睡眠"); break; }
    case "wake": { const e = S.entries.find(x => x.id === t.dataset.id); if (e) { await putEntry({ ...e, end: Date.now() }); toast(`这一觉睡了 ${dur(Date.now() - e.ts)}`); } break; }
    case "addpick": pickType(); break;
    case "settings": openSettings(); break;
    case "addrule": readSettingsInputs(); S.settings.medIntervals.push({ name: "", hours: "" }); openSettings(); break;
    case "savesettings": readSettingsInputs(); $("#sheet").close(); await saveSettings(); toast("设置已保存"); break;
    case "export": offerFile(`母婴记录备份-${dayKey(Date.now())}.json`, JSON.stringify({ app: "xiaoyueliang", version: 1, exported: Date.now(), settings: S.settings, entries: S.entries }, null, 1), "application/json"); break;
    case "csv": offerFile(`母婴记录-${dayKey(Date.now())}.csv`, toCSV(), "text/csv"); break;
    case "import": $("#importFile").click(); break;
    case "demo": $("#sheet").open && $("#sheet").close(); await loadDemo(); break;
    case "cleardemo": { const n = await removeWhere(e => e.demo); toast(`已清除 ${n} 条演示记录`); break; }
    case "clearall": if (confirm("确定清空全部记录？建议先导出备份。此操作无法撤销。")) { $("#sheet").close(); const n = await removeWhere(() => true); toast(`已清空 ${n} 条`); } break;
    case "ask": ask(); break;
    case "sb-login": await sbAuth("login"); break;
    case "sb-signup": await sbAuth("signup"); break;
    case "sb-create": await sbFamily("create"); break;
    case "sb-join": await sbFamily("join"); break;
    case "sb-logout": await sbLogout(); break;
    case "sb-sync": await syncNow(); toast("已同步"); break;
  }
});
document.addEventListener("change", async ev => {
  const c = ev.target.closest("[data-checkup]");
  if (c) { S.settings.checkups = { ...(S.settings.checkups || {}), [c.dataset.checkup]: c.checked }; await saveSettings(); return; }
  if (ev.target.id === "importFile" && ev.target.files[0]) { await importJSON(ev.target.files[0]); ev.target.value = ""; return; }
  if (draft && ev.target.closest("#sheetIn") && ev.target.type === "checkbox") { readDraftInputs(); drawForm(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { S.q = ev.target.value; renderLogFocus = true; render(); return; }
  if (ev.target.type === "range") { const o = ev.target.parentElement.querySelector("output"); if (o) o.textContent = ev.target.value; }
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.close(); });

/* ============ boot ============ */
try { const th = localStorage.getItem(LS_KEY + ".theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
loadLocal(); render();
setInterval(() => { if (S.tab === "today" && !$("#sheet").open) { const h = document.querySelector(".hero"); if (h) h.outerHTML = heroHTML(); } }, 30e3);
if (!initSupabase()) initCloud();
setInterval(() => syncNow(), 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());
</script>
